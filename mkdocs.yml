site_name: "Stragittus — Articles"
site_url: "https://stragittus.github.io/Stragittus-Articles/"

theme:
  name: material
  language: fr
  logo: assets/brand/logo.png
  favicon: assets/brand/favicon.png
  palette:
    - scheme: default
      primary: white
      accent: red
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy

extra_css:
  - assets/css/stragittus.css

markdown_extensions:
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences

plugins:
  - search

nav:
  - Accueil: index.md
  - Articles: articles/index.md
  - How-To: how-to/index.md
