name: Build and Deploy MkDocs (HTML + PDF)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CI)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Build site (MkDocs)
        env:
          CI: "true"
        run: |
          mkdocs build --clean

      # MkDocs écrit dans ./site
      # Le plugin PDF (to-pdf) écrit dans ./pdf (à la racine du repo)
      - name: Copy PDFs into site/
        run: |
          if [ -d "pdf" ]; then
            mkdir -p site/pdf
            cp -R pdf/* site/pdf/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
